<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Accesos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-10 px-4 py-4 md:px-8 shadow-sm">
        <div class="max-w-7xl mx-auto flex justify-between items-center gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 text-white rounded-lg flex items-center justify-center text-xl shadow-sm border border-indigo-700">
                    <i class="ph ph-buildings"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-slate-900 leading-tight">Control de Accesos</h1>
                    <p class="text-xs text-emerald-600 font-medium flex items-center gap-1">
                        <span class="relative flex h-2 w-2">
                          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                        </span>
                        Sistema Activo
                    </p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="exportarExcel()" class="flex items-center gap-2 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-2 rounded-lg border border-emerald-200 font-medium text-sm transition-colors shadow-sm">
                    <i class="ph ph-download-simple text-lg text-emerald-700"></i>
                    <span class="hidden sm:inline">Descargar CSV</span>
                </button>
                <button id="openQrBtn" class="flex items-center gap-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-2 rounded-lg border border-indigo-200 font-medium text-sm transition-colors">
                    <i class="ph ph-qr-code text-lg text-indigo-700"></i>
                    <span class="hidden sm:inline">Generar QR</span>
                </button>
                <div class="hidden sm:flex items-center gap-2 text-slate-600 bg-slate-100 px-4 py-2 rounded-lg border border-slate-200 font-mono text-sm">
                    <i class="ph ph-clock text-lg text-indigo-600"></i>
                    <span id="currentTime">--:--:--</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- QR Modal -->
    <div id="qrModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center bg-slate-900/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full mx-4 overflow-hidden transform scale-95 transition-transform duration-300" id="qrModalContent">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                    <i class="ph ph-qr-code text-indigo-600 text-xl"></i> QR de Acceso
                </h3>
                <button id="closeQrBtn" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-md hover:bg-slate-200">
                    <i class="ph ph-x text-xl"></i>
                </button>
            </div>
            <div class="p-8 flex flex-col items-center text-center">
                <div class="bg-white p-2 border-2 border-slate-100 rounded-xl shadow-sm mb-4">
                    <img id="qrImage" src="" alt="QR" class="w-48 h-48">
                </div>
                <h4 class="font-semibold text-slate-800 mb-1">Escanea para ingresar</h4>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-6 lg:space-y-0 lg:grid lg:grid-cols-12 lg:gap-8 relative">
        <section class="lg:col-span-4 h-fit">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i class="ph ph-user-plus text-indigo-600 text-xl"></i> Nuevo Ingreso
                    </h2>
                </div>
                <form id="visitorForm" class="p-6 space-y-5">
                    <div id="notification" class="hidden p-3 rounded-lg text-sm font-medium transition-all duration-300"></div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Nombre Completo</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph ph-identification-card text-slate-400 text-lg"></i></div>
                            <input type="text" id="fullName" required placeholder="Ej. Juan Pérez" class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" autocomplete="off">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">RUT / DNI</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph ph-fingerprint text-slate-400 text-lg"></i></div>
                            <input type="text" id="documentId" required placeholder="Ej. 12.345.678-9" class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" autocomplete="off">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1.5">Antigüedad</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><i class="ph ph-calendar-star text-slate-400 text-lg"></i></div>
                            <input type="text" id="antiguedad" required placeholder="Ej. 2 años, Nuevo, etc." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" autocomplete="off">
                        </div>
                    </div>
                    <div class="pt-2">
                        <button type="submit" class="w-full flex justify-center items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition-colors shadow-sm">
                            <i class="ph ph-check-circle text-lg"></i> Registrar Ingreso
                        </button>
                    </div>
                </form>
            </div>
        </section>

        <section class="lg:col-span-8">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 h-full flex flex-col overflow-hidden">
                <div class="px-6 py-5 border-b border-slate-100 bg-slate-50/50 flex justify-between items-center">
                    <h2 class="text-lg font-semibold text-slate-800 flex items-center gap-2">
                        <i class="ph ph-users text-indigo-600 text-xl"></i> Registro de Visitas
                    </h2>
                    <div class="text-sm text-slate-500 bg-white px-3 py-1.5 rounded-md border border-slate-200">
                        <i class="ph ph-clock text-lg"></i> <span id="currentTimeMobile">--:--:--</span>
                    </div>
                </div>
                <div class="p-0 overflow-x-auto custom-scrollbar flex-grow">
                    <table class="w-full text-left border-collapse whitespace-nowrap min-w-[700px]">
                        <thead>
                            <tr class="bg-slate-50 border-b border-slate-200 text-slate-600 text-xs uppercase tracking-wider font-semibold">
                                <th class="px-6 py-4">Visitante</th>
                                <th class="px-6 py-4">Documento</th>
                                <th class="px-6 py-4">Antigüedad</th>
                                <th class="px-6 py-4">Entrada / Salida</th>
                                <th class="px-6 py-4 text-center">Estado</th>
                                <th class="px-6 py-4 text-right">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="visitorsTableBody" class="divide-y divide-slate-100 text-sm">
                            <tr id="emptyState"><td colspan="6" class="px-6 py-12 text-center text-slate-400">No hay visitantes registrados.</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>

    <script>
        // URL de Google Apps Script (cuando quieras sincronizarlo con Drive, solo pega tu URL aquí entre las comillas)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxpDZdRys1pxaMcR4uASEFFaeqCVGudbzPXQ_Rqhz9zpgrXgMa7dt9Pbi1al5KmLhQpdQ/exec"; 
window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('saved_nombre')) {
                const nameInput = document.getElementById('fullName');
                const rutInput = document.getElementById('documentId');
                const antInput = document.getElementById('antiguedad');
                
                if (nameInput) nameInput.value = localStorage.getItem('saved_nombre');
                if (rutInput) rutInput.value = localStorage.getItem('saved_rut');
                if (antInput) antInput.value = localStorage.getItem('saved_antiguedad');
            }
        });
        let visitors = JSON.parse(localStorage.getItem('visitantes')) || [];
        
        const form = document.getElementById('visitorForm');
        const tableBody = document.getElementById('visitorsTableBody');
        const emptyState = document.getElementById('emptyState');
        const clockElement = document.getElementById('currentTime');
        const clockElementMobile = document.getElementById('currentTimeMobile');
        const notification = document.getElementById('notification');

        setInterval(() => {
            const timeString = new Date().toLocaleTimeString('es-CL');
            clockElement.textContent = timeString;
            clockElementMobile.textContent = timeString;
        }, 1000);

        function showNotification(message, type = 'success') {
            notification.textContent = message;
            notification.className = 'p-3 rounded-lg text-sm font-medium transition-all duration-300 mb-4 border block';
            if (type === 'success') {
                notification.classList.add('bg-green-50', 'text-green-700', 'border-green-200');
            } else {
                notification.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
            }
            setTimeout(() => notification.classList.add('hidden'), 3000);
        }

        function formatDuration(ms) {
            const minutes = Math.floor((ms / (1000 * 60)) % 60);
            const hours = Math.floor((ms / (1000 * 60 * 60)));
            return `${hours}h ${minutes}m`;
        }

        function saveAndRender() {
            localStorage.setItem('visitantes', JSON.stringify(visitors));
            tableBody.innerHTML = '';
            if (visitors.length === 0) {
                tableBody.appendChild(emptyState);
                return;
            }

            const sortedVisitors = [...visitors].sort((a, b) => b.id - a.id);

            sortedVisitors.forEach(visitor => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition-colors group';

                const statusBadge = visitor.status === 'active' 
                    ? `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> En recinto</span>`
                    : `<span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600"><span class="w-1.5 h-1.5 rounded-full bg-slate-400"></span> Salió (${visitor.duration || ''})</span>`;

                const actionButton = visitor.status === 'active'
                    ? `<button onclick="markDeparture(${visitor.id})" class="text-xs font-medium text-rose-600 bg-rose-50 hover:bg-rose-100 px-3 py-1.5 rounded-md transition-colors border border-rose-200">Marcar Salida</button>`
                    : `<span class="text-xs text-slate-400 italic">Completado</span>`;

                tr.innerHTML = `
                    <td class="px-6 py-4 font-medium text-slate-900">${visitor.fullName}</td>
                    <td class="px-6 py-4 text-slate-600 font-mono text-xs">${visitor.documentId}</td>
                    <td class="px-6 py-4 text-slate-600">${visitor.antiguedad}</td>
                    <td class="px-6 py-4 text-slate-600 text-xs">Entrada: ${visitor.entryTime} ${visitor.exitTime ? '<br>Salida: ' + visitor.exitTime : ''}</td>
                    <td class="px-6 py-4 text-center">${statusBadge}</td>
                    <td class="px-6 py-4 text-right">${actionButton}</td>
                `;
                tableBody.appendChild(tr);
            });
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const documentId = document.getElementById('documentId').value.trim();
            const antiguedad = document.getElementById('antiguedad').value.trim();

            localStorage.setItem('saved_nombre', fullName);
            localStorage.setItem('saved_rut', documentId);
            localStorage.setItem('saved_antiguedad', antiguedad);
            
            if(!fullName || !documentId || !antiguedad) return;

            const nuevoVisitante = {
                id: Date.now(),
                fullName, documentId, antiguedad,
                entryTime: new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' }),
                startTimestamp: Date.now(),
                status: 'active'
            };

            visitors.push(nuevoVisitante);
            form.reset();
            document.getElementById('fullName').value = localStorage.getItem('saved_nombre');
            document.getElementById('documentId').value = localStorage.getItem('saved_rut');
            document.getElementById('antiguedad').value = localStorage.getItem('saved_antiguedad');
            
            document.getElementById('fullName').focus();
            showNotification('Ingreso registrado exitosamente.');
            saveAndRender();

            // Sincronizar con Google Sheets si la URL está configurada
            if (GOOGLE_SCRIPT_URL) {
                fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: fullName, rut: documentId, antiguedad: antiguedad, entrada: nuevoVisitante.entryTime, salida: 'En recinto', duracion: '-' })
                }).catch(err => console.log(err));
            }
        });

        window.markDeparture = function(id) {
    const index = visitors.findIndex(v => v.id === id);
    if (index !== -1) {
        const endTimestamp = Date.now();
        visitors[index].status = 'departed';
        visitors[index].exitTime = new Date().toLocaleTimeString('es-CL', { hour: '2-digit', minute: '2-digit' });
        visitors[index].duration = formatDuration(endTimestamp - visitors[index].startTimestamp);
        
        showNotification('Salida registrada.');
        saveAndRender();

        if (GOOGLE_SCRIPT_URL) {
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: "updateExit",
                    rut: visitors[index].documentId,
                    salida: visitors[index].exitTime,
                    duracion: visitors[index].duration
                })
            }).catch(err => console.log(err));
        }
    }
}

        window.exportarExcel = function() {
            if (visitors.length === 0) { alert("No hay datos."); return; }
            let csv = "Nombre,RUT,Antiguedad,Entrada,Salida,Duracion\n";
            visitors.forEach(v => { csv += `"${v.fullName}","${v.documentId}","${v.antiguedad}","${v.entryTime}","${v.exitTime || 'En recinto'}","${v.duration || '-'}"\n`; });
            const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Registro_${new Date().toLocaleDateString('es-CL')}.csv`;
            link.click();
        }

        const qrModal = document.getElementById('qrModal');
        const qrModalContent = document.getElementById('qrModalContent');
        document.getElementById('openQrBtn').onclick = () => {
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(window.location.href)}`;
            qrModal.classList.remove('hidden');
            setTimeout(() => { qrModalContent.classList.remove('scale-95'); qrModalContent.classList.add('scale-100'); }, 10);
        };
        document.getElementById('closeQrBtn').onclick = () => {
            qrModalContent.classList.remove('scale-100'); qrModalContent.classList.add('scale-95');
            setTimeout(() => qrModal.classList.add('hidden'), 300);
        };

        saveAndRender();
    </script>
</body>
</html>
